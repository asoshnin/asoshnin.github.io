<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <!-- Primary gradient: Deep obsidian to slate -->
    <linearGradient id="gradPrimary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0B1426;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E3A5F;stop-opacity:1" />
    </linearGradient>
    <!-- Signal accent gradient -->
    <linearGradient id="gradAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8A97E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A88B5E;stop-opacity:1" />
    </linearGradient>
    <!-- Glow effect for the active slot -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="#FFFFFF" rx="4"/>

  <!-- === MARK: The TNA Meridian === -->
  <!-- Three vertical slot lines -->
  <g transform="translate(60, 50)">
    <!-- Grid tracks -->
    <line x1="0" y1="0" x2="0" y2="100" stroke="#D5DDE5" stroke-width="1.5"/>
    <line x1="40" y1="0" x2="40" y2="100" stroke="#D5DDE5" stroke-width="1.5"/>
    <line x1="80" y1="0" x2="80" y2="100" stroke="#D5DDE5" stroke-width="1.5"/>
    <line x1="120" y1="0" x2="120" y2="100" stroke="#D5DDE5" stroke-width="1.5"/>
    <line x1="160" y1="0" x2="160" y2="100" stroke="#D5DDE5" stroke-width="1.5"/>

    <!-- Horizontal grid lines -->
    <line x1="0" y1="0" x2="160" y2="0" stroke="#E8ECF0" stroke-width="1"/>
    <line x1="0" y1="50" x2="160" y2="50" stroke="#E8ECF0" stroke-width="1"/>
    <line x1="0" y1="100" x2="160" y2="100" stroke="#E8ECF0" stroke-width="1"/>

    <!-- Slot 1: Filled (deep navy) -->
    <rect x="2" y="10" width="36" height="30" rx="3" fill="url(#gradPrimary)"/>
    <text x="20" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>

    <!-- Slot 2: Filled (deep navy) -->
    <rect x="42" y="10" width="36" height="30" rx="3" fill="url(#gradPrimary)"/>
    <text x="60" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text>

    <!-- Slot 3: THE ACTIVE SLOT (Third Next - highlighted with signal gold) -->
    <rect x="82" y="10" width="36" height="30" rx="3" fill="url(#gradAccent)" filter="url(#glow)"/>
    <text x="100" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0B1426" text-anchor="middle">3</text>

    <!-- Slot 4: Open/available (subtle outline) -->
    <rect x="122" y="10" width="36" height="30" rx="3" fill="#F6F8FA" stroke="#C8A97E" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Flow line connecting slots -->
    <path d="M 20 55 Q 60 80, 100 55 Q 140 30, 160 45" fill="none" stroke="url(#gradAccent)" stroke-width="2.5" stroke-linecap="round"/>

    <!-- The "Next" arrow at end of flow -->
    <polygon points="155,40 168,48 155,56" fill="#C8A97E"/>
  </g>

  <!-- === WORDMARK === -->
  <g transform="translate(260, 55)">
    <!-- "Third" -->
    <text x="0" y="55" font-family="'Inter', 'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#0B1426" letter-spacing="-1.5">Third</text>
    <!-- "Next" with accent color -->
    <text x="138" y="55" font-family="'Inter', 'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#1E3A5F" letter-spacing="-1.5">Next</text>
    <!-- Registered symbol -->
    <text x="262" y="38" font-family="system-ui, sans-serif" font-size="14" fill="#6B7B8D">&#174;</text>
  </g>

  <!-- Tagline -->
  <text x="260" y="115" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="400" fill="#6B7B8D" letter-spacing="2.5">THE SCHEDULE INTELLIGENCE LAYER</text>

  <!-- === CLEAR SPACE INDICATOR === -->
  <g opacity="0.3">
    <line x1="60" y1="160" x2="60" y2="180" stroke="#C8A97E" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="522" y1="160" x2="522" y2="180" stroke="#C8A97E" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="60" y1="170" x2="522" y2="170" stroke="#C8A97E" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="291" y="185" font-family="system-ui, sans-serif" font-size="9" fill="#C8A97E" text-anchor="middle">MINIMUM CLEAR SPACE</text>
  </g>
</svg>