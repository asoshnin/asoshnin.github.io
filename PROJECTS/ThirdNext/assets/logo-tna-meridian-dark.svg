<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="gradPrimaryDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6B8CAE;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8BA4BE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradAccentDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4B88A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8A97E;stop-opacity:1" />
    </linearGradient>
    <filter id="glowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="200" fill="#0B1426" rx="4"/>

  <g transform="translate(60, 50)">
    <line x1="0" y1="0" x2="0" y2="100" stroke="#1E3A5F" stroke-width="1.5"/>
    <line x1="40" y1="0" x2="40" y2="100" stroke="#1E3A5F" stroke-width="1.5"/>
    <line x1="80" y1="0" x2="80" y2="100" stroke="#1E3A5F" stroke-width="1.5"/>
    <line x1="120" y1="0" x2="120" y2="100" stroke="#1E3A5F" stroke-width="1.5"/>
    <line x1="160" y1="0" x2="160" y2="100" stroke="#1E3A5F" stroke-width="1.5"/>
    <line x1="0" y1="0" x2="160" y2="0" stroke="#162D4A" stroke-width="1"/>
    <line x1="0" y1="50" x2="160" y2="50" stroke="#162D4A" stroke-width="1"/>
    <line x1="0" y1="100" x2="160" y2="100" stroke="#162D4A" stroke-width="1"/>

    <rect x="2" y="10" width="36" height="30" rx="3" fill="url(#gradPrimaryDark)"/>
    <text x="20" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0B1426" text-anchor="middle">1</text>

    <rect x="42" y="10" width="36" height="30" rx="3" fill="url(#gradPrimaryDark)"/>
    <text x="60" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#0B1426" text-anchor="middle">2</text>

    <rect x="82" y="10" width="36" height="30" rx="3" fill="url(#gradAccentDark)" filter="url(#glowDark)"/>
    <text x="100" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#0B1426" text-anchor="middle">3</text>

    <rect x="122" y="10" width="36" height="30" rx="3" fill="#0D1D33" stroke="#C8A97E" stroke-width="1.5" stroke-dasharray="4,3"/>

    <path d="M 20 55 Q 60 80, 100 55 Q 140 30, 160 45" fill="none" stroke="url(#gradAccentDark)" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="155,40 168,48 155,56" fill="#C8A97E"/>
  </g>

  <g transform="translate(260, 55)">
    <text x="0" y="55" font-family="'Inter', 'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#F0F2F5" letter-spacing="-1.5">Third</text>
    <text x="138" y="55" font-family="'Inter', 'SF Pro Display', system-ui, -apple-system, sans-serif" font-size="52" font-weight="700" fill="#8BA4BE" letter-spacing="-1.5">Next</text>
    <text x="262" y="38" font-family="system-ui, sans-serif" font-size="14" fill="#5A6B7D">&#174;</text>
  </g>

  <text x="260" y="115" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="400" fill="#5A6B7D" letter-spacing="2.5">THE SCHEDULE INTELLIGENCE LAYER</text>

  <g opacity="0.25">
    <line x1="60" y1="160" x2="60" y2="180" stroke="#C8A97E" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="522" y1="160" x2="522" y2="180" stroke="#C8A97E" stroke-width="1" stroke-dasharray="3,2"/>
    <line x1="60" y1="170" x2="522" y2="170" stroke="#C8A97E" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="291" y="185" font-family="system-ui, sans-serif" font-size="9" fill="#C8A97E" text-anchor="middle">MINIMUM CLEAR SPACE</text>
  </g>
</svg>